server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.hikari.schema=sgp
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.initialization-mode=never

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=sgp
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

security.oauth2.client.client-id=${CLIENT_ID}
security.oauth2.client.client-secret=${CLIENT_SECRET}

jwt.secret=${JWT_SECRET}
jwt.duration=${JWT_DURATION:86400}

cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}
